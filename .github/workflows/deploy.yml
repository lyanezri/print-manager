name: Deploy Print Manager

on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE: lyanezri/print-manager

permissions: {}

concurrency:
  group: print-manager-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt httpx

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit==1.9.4

      - name: Scan Python code for medium and high severity issues
        run: bandit -r . -x ./.venv,./tests -ll

  build-and-push:
    needs: [test, dependency-audit, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push print-manager
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Scan image for high-impact vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy through restricted SSH identity
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          key_file="$RUNNER_TEMP/printmanager-ci-key"
          known_hosts="$RUNNER_TEMP/printmanager-known-hosts"
          cleanup() {
            rm -f "$key_file" "$known_hosts"
            unset SSH_PRIVATE_KEY REGISTRY_TOKEN
          }
          trap cleanup EXIT HUP INT TERM
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          ssh-keyscan -T 10 -t ed25519 "$ORACLE_HOST" > "$known_hosts"
          host_fingerprint="$(ssh-keygen -lf "$known_hosts" | awk 'NR == 1 { print $2 }')"
          test "$host_fingerprint" = "SHA256:QUp68hXHOu7zUu7btxmS9ed8X/4K5FFXe7ENbtClFWk"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            -o UserKnownHostsFile="$known_hosts" \
            "dealhunter-ci@$ORACLE_HOST" "deploy-print $GITHUB_SHA"
